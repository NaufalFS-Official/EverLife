name: EverLife CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Typecheck & Linter (L1 DoD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Locked Dependencies
        run: npm ci

      - name: Run TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

  security-check:
    name: Secret & Vulnerability Scan (D7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Locked Dependencies
        run: npm ci

      - name: Scan Secrets & Hardcoded Keys
        run: npm run detect-secrets

  unit-tests:
    name: Vitest Logic & Performance Harness (L2/L3 DoD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Locked Dependencies
        run: npm ci

      - name: Execute Vitest Suite
        run: npm run test:unit

  build-and-gate:
    name: Production Build & Bundle Budget Gate (L3/L5 DoD)
    runs-on: ubuntu-latest
    needs: [code-quality, security-check, unit-tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Locked Dependencies
        run: npm ci

      - name: Compile Production Build
        run: npm run build

      - name: Enforce Bundle Budget Gate (< 450 kB gzip)
        run: npm run verify:bundle

      - name: Package Portal Distribution
        run: npm run build:portal

      - name: Upload Static Artifact
        uses: actions/upload-artifact@v4
        with:
          name: everlife-dist
          path: dist/
          retention-days: 7
